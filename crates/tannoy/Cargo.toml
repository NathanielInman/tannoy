[package]
name = "tannoy"
description = "Tannoy: the daemon, CLI and waybar module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tannoy"
path = "src/main.rs"

[dependencies]
tannoy-core = { path = "../tannoy-core" }
bar-anchor = { path = "../bar-anchor" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Not used directly: holds zbus's `blocking` at 1.6. Since 1.7.0 its idle
# pool thread never exits and wakes every 500 ms for the daemon's whole life
# (smol-rs/blocking#83). Drop this once a fixed release is out.
blocking = "~1.6.2"
