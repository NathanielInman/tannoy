name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Libraries
        run: .github/scripts/gtk4-layer-shell.sh
      - name: Build
        env:
          PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig
        run: cargo build --release --locked --target ${{ matrix.target }} -p tannoy -p tannoy-board
      - name: Package
        run: |
          mkdir dist
          for b in tannoy tannoy-board; do cp "target/${{ matrix.target }}/release/$b" dist/; done
          cp README.md LICENSE dist/
          cp -r packaging/completions packaging/man packaging/systemd packaging/examples dist/
          tar -czf "tannoy-${{ matrix.target }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tannoy-${{ matrix.target }}
          path: tannoy-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum tannoy-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Tannoy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
