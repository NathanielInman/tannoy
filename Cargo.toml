[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/NathanielInman/tannoy"
authors = ["Nathaniel Inman"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
