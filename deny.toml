# cargo deny check: advisories, licenses, bans and sources for the crates
# Tannoy actually builds (the two Linux targets it releases for).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec advisories are errors; a yanked crate in the lockfile too.
yanked = "deny"
ignore = []

[licenses]
# Everything here is compatible with shipping Tannoy under MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two majors of one crate cost build time; say so, but do not fail on it.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies have no version; they are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
